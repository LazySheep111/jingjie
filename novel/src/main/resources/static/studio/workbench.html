<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>分镜工作台</title><link rel="stylesheet" href="/studio/css/studio.css"></head><body><div id="studioShell" class="studio-shell"><aside id="projectRail" class="rail">镜界<br><br>分镜<br>资产<br>项目</aside><header class="topbar"><div><small>视频创作</small><h1>分镜工作台</h1></div><button>生成任务</button></header><main id="studioCanvas"><section><h2>镜头序列</h2><div id="sceneTrack">选择项目后显示场景轨道。</div></section><section id="sceneEditor">选择场景以编辑分镜脚本与首帧。</section><section id="actionDock"><div id="videoStatus">尚未选择首帧<br><small>选择或生成首帧后即可生成视频。</small></div><select id="videoResolution"><option>768P</option><option>1080P</option><option>2K</option></select><button type="button" data-action="generate-video" disabled>生成视频</button></section></main><aside id="studioInspector"><section><h2>资产</h2><div id="assetInspector">选中场景后显示参考资产。</div></section><section><h2>生成任务</h2><div id="taskInspector">暂无进行中的任务。</div></section></aside></div><script src="/studio/js/api.js"></script><script src="/studio/js/workbench.js"></script></body></html>
