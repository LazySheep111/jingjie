<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说全文工作台 · 新版预览</title>
    <link rel="stylesheet" href="/studio/css/workbench-shell.css?v=20260919f">
    <link rel="stylesheet" href="/studio/css/workbenches-new.css?v=20260918t">
</head>
<body class="studio-theme new-workbench-page" data-shell-page="detail">
<main>
    <header class="new-workbench-header workbench-context"><div><p class="new-workbench-kicker">小说正文</p><h1 id="novelTitle">正在加载</h1><p id="generationStatus" class="hint" aria-live="polite">正在获取生成状态...</p></div><div class="card-actions"><button id="importNovelBtn" type="button" class="secondary-button" hidden>导入新小说</button><button id="backCreateBtn" type="button" class="secondary-button">返回创作页</button><button id="backHistoryBtn" type="button" class="secondary-button">回到历史列表</button><button id="downloadBtn" type="button">下载整本小说</button></div></header>
    <section class="reader-workspace">
    <section id="readerEntryState" class="reader-entry-state" hidden><p class="eyebrow">开始创作</p><h2>导入小说后开始章节与分镜创作</h2><p>支持 TXT、DOCX 文件。也可以从已保存的历史作品继续创作。</p><div class="card-actions"><button id="readerEntryImportBtn" type="button">导入 TXT / DOCX</button><button id="readerHistoryBtn" type="button" class="secondary-button">从历史作品选择</button></div></section>
    <section id="readerLayout" class="new-reader-grid" hidden>
        <div class="chapter-rail"><aside class="chapter-sidebar"><p class="eyebrow">章节目录</p><h2>目录</h2><div id="chapterNav" class="chapter-nav"></div></aside></div>
        <article class="reader-panel"><div class="reader-actions"><button id="saveChapterBtn" type="button">保存修改</button><button id="regenerateChapterBtn" type="button" class="secondary-button">重新生成本章</button></div><h2 id="chapterTitle">请选择章节</h2><textarea id="chapterContent" class="reader-content"></textarea></article>
        <aside class="storyboard-panel storyboard-workflow-panel">
            <details class="visual-style-section"><summary class="visual-style-summary"><span><span class="eyebrow">全书统一设定</span><strong>视觉风格</strong></span><span id="visualStyleStatus" class="storyboard-summary"></span><span aria-hidden="true">展开</span></summary><p class="asset-meta">保存后会自动用于人物、场景和三视图提示词生成。</p><div class="visual-style-grid"><label>时代背景<input id="visualStyleEra" type="text" placeholder="例如：架空古代东方山村"></label><label>地域文化<input id="visualStyleRegion" type="text" placeholder="例如：东方乡村"></label><label>建筑风格<textarea id="visualStyleArchitecture" rows="2" placeholder="例如：土坯房、灰瓦、木梁、石板路"></textarea></label><label>常用材质<textarea id="visualStyleMaterial" rows="2" placeholder="例如：夯土、旧木、青石、灰瓦"></textarea></label><label>色彩风格<textarea id="visualStyleColorStyle" rows="2" placeholder="例如：低饱和、暖灰色调"></textarea></label><label>光照风格<textarea id="visualStyleLightingStyle" rows="2" placeholder="例如：自然光、柔和阴影"></textarea></label><label>整体画风<textarea id="visualStyleArtStyle" rows="2" placeholder="例如：写实电影感"></textarea></label><label>镜头风格<textarea id="visualStyleCameraStyle" rows="2" placeholder="例如：真实比例、电影级构图"></textarea></label><label class="visual-style-wide">补充要求<textarea id="visualStylePositivePrompt" rows="2"></textarea></label><label class="visual-style-wide">禁止出现的元素<textarea id="visualStyleNegativePrompt" rows="2" placeholder="例如：现代建筑、汽车、电线杆、玻璃幕墙"></textarea></label></div><div class="storyboard-actions"><button id="generateVisualStyleBtn" type="button" class="secondary-button">AI 生成初始风格</button><button id="saveVisualStyleBtn" type="button">保存视觉风格</button></div></details>
            <div class="asset-tabs" role="tablist" aria-label="正文辅助面板"><button id="storyboardTabBtn" type="button" class="asset-tab active" role="tab" aria-selected="true">分镜脚本</button><button id="assetTabBtn" type="button" class="asset-tab secondary-button" role="tab" aria-selected="false">人物与场景资产</button></div>
            <section id="storyboardTabPanel" class="storyboard-section"><div class="new-workbench-toolbar"><div><p class="eyebrow">视频创作</p><h3>分镜脚本</h3></div><span id="storyboardSummary" class="storyboard-summary">尚未生成</span></div><div class="storyboard-actions"><button id="generateStoryboardBtn" type="button">生成分镜脚本</button><button id="saveStoryboardBtn" type="button" class="secondary-button" hidden>保存分镜修改</button><button id="goVideoGenerationBtn" type="button" class="secondary-button" hidden>前往视频生成</button><button id="exportStoryboardBtn" type="button" class="secondary-button" hidden>导出 TXT</button></div><p id="storyboardStatus" class="status" aria-live="polite"></p><div id="storyboardEmpty" class="storyboard-empty">选择章节后，可以根据正文生成约 10 秒一段的视频分镜脚本。</div><div id="storyboardList" class="storyboard-list"></div></section>
            <section id="assetTabPanel" class="asset-section" hidden><div class="new-workbench-toolbar"><div><p class="eyebrow">视觉资产库</p><h3>人物与场景资产</h3></div><span id="assetTaskSummary" class="storyboard-summary">当前章节未提取</span></div><div class="storyboard-actions"><button id="extractAssetsBtn" type="button">提取人物/场景</button><button id="refreshAssetsBtn" type="button" class="secondary-button">刷新资产库</button></div><p id="assetStatus" class="status" aria-live="polite"></p><div class="asset-filters" role="group" aria-label="资产类型筛选"><button type="button" class="asset-filter active" data-asset-type="">全部</button><button type="button" class="asset-filter secondary-button" data-asset-type="CHARACTER">人物</button><button type="button" class="asset-filter secondary-button" data-asset-type="LOCATION">场景</button></div><div id="assetEmpty" class="storyboard-empty">选择章节后，可以提取本章人物和场景资产。</div><div id="assetList" class="asset-list"></div></section>
        </aside>
    </section>
    </section>
</main>
<div id="imagePreviewModal" class="image-preview-modal" hidden role="dialog" aria-modal="true" aria-label="三视图预览"><button id="closeImagePreviewBtn" class="secondary-button" type="button" aria-label="关闭预览">关闭</button><img id="imagePreview" class="image-preview" alt="三视图大图预览"></div>
<div id="videoNavigationModal" class="image-preview-modal" hidden role="dialog" aria-modal="true" aria-labelledby="videoNavigationTitle"><div class="video-navigation-dialog"><h3 id="videoNavigationTitle">分镜脚本尚未保存</h3><p>当前页面有未保存的分镜修改，前往视频生成前请选择处理方式。</p><div class="storyboard-actions"><button id="saveAndGoVideoBtn" type="button">保存并前往</button><button id="discardAndGoVideoBtn" type="button" class="secondary-button">不保存前往</button><button id="cancelVideoNavigationBtn" type="button" class="secondary-button">取消</button></div></div></div>
<div id="readerImportDialog" class="reader-import-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="readerImportTitle"><section class="reader-import-card"><div class="new-workbench-toolbar"><h2 id="readerImportTitle">导入新小说</h2><button id="closeReaderImportBtn" type="button" class="secondary-button">关闭</button></div><label>小说文件<input id="readerImportFile" type="file" accept=".txt,.docx,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><label>作品名称（可选）<input id="readerImportTitleInput" type="text" placeholder="默认使用文件名"></label><p id="readerImportStatus" class="status" aria-live="polite"></p><div class="card-actions"><button id="readerImportSubmitBtn" type="button">导入并开始创作</button><button id="cancelReaderImportBtn" type="button" class="secondary-button">取消</button></div></section></div>
<script src="/js/novel-detail.js"></script>
<script src="/studio/js/workbench-shell.js?v=20260918c"></script>
<link rel="stylesheet" href="/studio/css/assistant-panel.css?v=20260919g">
<script src="/studio/js/assistant-panel.js?v=20260919g"></script>
</body>
</html>
